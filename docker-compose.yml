services:
  db:
    image: postgres:16-alpine
    environment:
      # app_owner is the superuser inside the container. It is used ONLY for
      # migrations and test setup; the app connects as app_user (see migrations).
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: tasks
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d tasks"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
